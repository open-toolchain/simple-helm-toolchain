template.name: "Kubernetes-App mit Helm 3 entwickeln"
template.description: "Mit dieser Toolchain können Sie eine Docker-Anwendung zusammen mit dem zugehörigen Helm-Diagramm in der Quellcodeverwaltung entwickeln und sie automatisch in einem Kubernetes-Cluster bereitstellen. Die Toolchain führt vor der Builderstellung oder Bereitstellung Prüfungen auf den ordnungsgemäßen Zustand durch und stellt den Datenschutz sicher, indem eine private Container-Registry und Namespaces für die Container-Registry und den Kubernetes-Cluster verwendet werden. Diese Toolchain nutzt auch [Code Risk Analyzer](https://cloud.ibm.com/docs/code-risk-analyzer-cli-plugin?topic=code-risk-analyzer-cli-plugin-cra-cli-plugin#cra-tekton-pipelines) und [Vulnerability Advisor](https://cloud.ibm.com/docs/Registry?topic=Registry-va_index&interface=ui), um sicherzustellen, dass nur sichere Images bereitgestellt werden.\n\nStandardmäßig verwendet die Toolchain eine Beispiel-App „Hello World“ von Node.js, aber Sie können stattdessen auch eine Verknüpfung zu Ihrem eigenen Git-Repository herstellen, solange dieses über ein Dockerfile und ein Helm-Diagramm verfügt.\n\n Sie können Ihre IBM Cloud-Container-Cluster in der [Konsole](https://cloud.ibm.com/containers-kubernetes/clusters) verwalten.\n\n Diese Toolchain verwendet Tools, die Teil des Continuous Delivery-Service sind. Wenn sich noch keine Instanz dieses Service in Ihrer Ressourcengruppe oder Organisation befindet, wird sie automatisch kostenfrei hinzugefügt, wenn Sie auf **Erstellen** klicken. Weitere Informationen und Bedingungen finden Sie im [IBM Cloud-Katalog](/catalog/services/continuous-delivery/).\n\nKlicken Sie auf **Erstellen**, um zu beginnen.\n\nSchritt-für-Schritt-Anleitungen finden Sie im [classic-tutorial](https://www.ibm.com/cloud/architecture/tutorials/use-develop-kubernetes-app-with-helm-toolchain) oder [tekton-tutorial](https://www.ibm.com/cloud/architecture/tutorials/use-develop-kubernetes-app-helm-toolchain-with-tekton-pipelines)."
template.gettingStarted: " **Ihre Toolchain ist bereit!**\n**Schnellstart:** Übertragen Sie eine Änderung an das Git-Repo, um eine neue Docker-Image-Erstellung auszulösen, die auf Schwachstellen gescannt und mit Helm 3 auf Ihrem Kubernetes-Cluster bereitgestellt wird. Eine schrittweise Anleitung finden Sie im [Lernprogramm](https://www.ibm.com/cloud/architecture/tutorials/use-develop-kubernetes-app-with-helm-toolchain?task=2) für diese Toolchain."
